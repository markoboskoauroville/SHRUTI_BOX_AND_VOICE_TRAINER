# The APK is built here and nowhere else (MANTRA_MANIFEST android-app.md §1a), from MINIMALIST_STOPWATCH's workflow.
# Actions are pinned by commit, never by tag (the SHAs and their reasons are in that repository's workflow); the
# Gradle distribution is pinned by sha256 in gradle/wrapper/gradle-wrapper.properties.

name: Build the shruti box

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      # G1: provenance. The version from the one place it is written; a clean tree; built on a runner.
      - name: "Gate G1 — provenance"
        id: provenance
        run: |
          set -euo pipefail
          V=$(grep -E '^appVersion=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version: $V"
          case "$V" in ''|*[!0-9]*) echo "appVersion is not a whole number"; exit 1;; esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "commit: $(git rev-parse HEAD)  branch: ${GITHUB_REF_NAME}"
          DIRTY=$(git status --porcelain | wc -l)
          echo "uncommitted or untracked files: $DIRTY"
          [ "$DIRTY" = "0" ]

      # G2, first half: the whole history, not just the diff. `|| true` because a grep that finds nothing exits 1.
      - name: "Gate G2 — scan the whole history for key shapes"
        run: |
          set -euo pipefail
          echo "commits examined: $(git rev-list --count HEAD)"
          HITS=$(git log -p --all | grep -acE '(gsk_|AIza|ghp_|github_pat_|sk-ant-|xox[baprs]-)[A-Za-z0-9_-]{20,}' || true)
          echo "key-shaped strings in history: ${HITS:-0}"
          [ "${HITS:-0}" = "0" ]

      - name: "Gate G3 — the structural checks"
        run: python3 scripts/verify.py

      # G5: every loop counted; an unbounded one stops the build. Every stage guarded: a clean count is a zero, not a red.
      - name: "Gate G5 — loops and waits, counted"
        run: |
          set -uo pipefail
          SRC=app/src/main/java/com/mantra/shrutibox
          nocount() { "$@" || true; }
          LOOPS=$( nocount grep -rnE '(while|for|repeat)[[:space:]]*[({]' --include='*.kt' "$SRC" | wc -l)
          UNBOUNDED=$( nocount grep -rnF 'while (true)' --include='*.kt' "$SRC" | wc -l)
          echo "loops examined:         $LOOPS"
          echo "written as while(true): $UNBOUNDED"
          [ "$UNBOUNDED" = "0" ] || { echo "an unbounded loop is present"; exit 1; }
          [ "$LOOPS" -ge 3 ] || { echo "found fewer loops than exist: this check is broken, not the code"; exit 1; }

      # Test 1: the reeds and the mixer alone, on a plain JVM. A floor of cases, so a suite that did not run is red.
      - name: "Test 1 — the reeds"
        run: |
          set -uo pipefail
          ./gradlew :app:testReleaseUnitTest --no-daemon || true
          python3 - <<'EOF'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob("app/build/test-results/testReleaseUnitTest/*.xml")
          total = fails = errors = 0
          for f in files:
              r = ET.parse(f).getroot()
              total += int(r.get("tests", 0)); fails += int(r.get("failures", 0)); errors += int(r.get("errors", 0))
              for c in r.iter("testcase"):
                  for bad in list(c.findall("failure")) + list(c.findall("error")):
                      print("FAILED:", c.get("name"), (bad.get("message") or "")[:200])
          print(f"result files: {len(files)}   tests run: {total}   failures: {fails}   errors: {errors}")
          if len(files) == 0: sys.exit("no test results at all: the suite did not run")
          if total < 16: sys.exit(f"expected at least 16 cases, found {total}")
          sys.exit(1 if (fails or errors) else 0)
          EOF

      # One permanent key for the life of the app (android-app.md §3, updatable.md): a PKCS12 kept as a secret.
      - name: Restore the signing key
        env:
          KS: ${{ secrets.SHRUTIBOX_KEYSTORE }}
          KS_PW: ${{ secrets.SHRUTIBOX_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KS" ]; then echo "No keystore secret. This build would not be upgradable in place."; exit 1; fi
          echo "$KS" | base64 -d > shrutibox.p12
          printf 'storeFile=shrutibox.p12\nstorePassword=%s\nkeyAlias=shrutibox\nkeyPassword=%s\n' "$KS_PW" "$KS_PW" > keystore.properties
          keytool -list -storetype PKCS12 -keystore shrutibox.p12 -storepass "$KS_PW" | grep -i 'SHA-256' || true

      - name: Build the release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: "Gate G2 — scan the built APK"
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "scanning: $APK ($(stat -c%s "$APK") bytes)"
          HITS=$(strings -a "$APK" | grep -acE '(gsk_|AIza|ghp_|github_pat_|sk-ant-|xox[baprs]-)[A-Za-z0-9_-]{20,}' || true)
          echo "key-shaped strings in the artefact: ${HITS:-0}"
          [ "${HITS:-0}" = "0" ]

      # G1's last check: the number inside the APK equals the number in its name and its tag.
      - name: "Gate G1 — the three numbers agree"
        env:
          V: ${{ steps.provenance.outputs.version }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          BADGE=$("$AAPT" dump badging "$APK")
          CODE=$(echo "$BADGE" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p")
          NAME=$(echo "$BADGE" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")
          echo "gradle.properties: $V    versionCode: $CODE    versionName: $NAME    tag will be: v$V"
          [ "$CODE" = "$V" ]
          [ "$NAME" = "$V" ]

      - name: Keep the APK on the run itself
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shrutibox-v${{ steps.provenance.outputs.version }}-build${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # versioning.md: the number at both ends of the name. An existing tag is a loud skip, not a red.
      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.provenance.outputs.version }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          OUT="${V}-shrutibox-v${V}.apk"
          cp "$APK" "$OUT"
          if gh release view "v${V}" >/dev/null 2>&1; then
            echo "NOTHING WAS PUBLISHED: release v${V} already exists. If the app changed, bump appVersion."
            echo "published=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          gh release create "v${V}" "$OUT" --title "Mantra Shruti Box v${V}" \
            --notes "A shruti box drawn in vectors: tap a valve, its reed sounds; the bellows breathe. Build ${GITHUB_RUN_NUMBER} from $(git rev-parse --short HEAD)."
          echo "published=true" >> "$GITHUB_OUTPUT"

      # versioning.md §4: only the two newest builds stay.
      - name: Keep the two newest releases
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[2:] | .[].tagName' | while read -r tag; do
            [ -z "$tag" ] && continue
            gh release delete "$tag" --yes --cleanup-tag || true
          done
