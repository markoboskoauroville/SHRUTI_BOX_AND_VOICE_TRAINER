# THE VERSION, AND IT IS THE ONLY PLACE IT IS WRITTEN (MANTRA_MANIFEST versioning.md: one whole number, no dots).
# build.gradle.kts derives versionCode and versionName from it; the workflow derives the file name and the tag.
appVersion=1

org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
